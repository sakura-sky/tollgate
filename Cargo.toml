[package]
name = "tollgate"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Tollgate - AI gateway and spend-control proxy for LLM providers"
authors = ["Andrew Stevens <andrew@andrewjstevens.com>"]
repository = "https://github.com/sakura-sky/tollgate"
homepage = "https://github.com/sakura-sky/tollgate"
readme = "README.md"
keywords = ["ai", "gateway", "llm", "gemini", "vertex"]
categories = ["web-programming::http-server", "command-line-utilities"]
publish = false

[[bin]]
name = "tollgate"
path = "src/main.rs"

[lib]
name = "tollgate"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "toml"] }
http = "1"
humantime-serde = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "set-header", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for provider adapters (Vertex, Anthropic) and the GCP metadata server.
# `stream` enables response body streaming for the OpenAI SSE relay.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Streaming relay for the OpenAI-compatible endpoint (SSE pass-through + metering).
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"

# API-key hashing: HMAC-SHA256 (fast, correct for high-entropy keys) + constant-
# time compare. rand for key generation, hex for encoding.
hmac = "0.12"
sha2 = "0.11"
subtle = "2"
rand = "0.8"
hex = "0.4"

# OTel - initialised only when telemetry.otlp_endpoint is set in config.
# 0.32 line: the batch exporter no longer takes a runtime, so no rt-tokio feature.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
