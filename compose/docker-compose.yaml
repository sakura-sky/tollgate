#
# Local development dependencies. Run from the repo root:
#   docker compose -f compose/docker-compose.yaml up -d
#
# That starts Postgres and Valkey only. To run Tollgate itself in the stack as
# well (needs a .env with a real pepper first, see the README):
#   docker compose -f compose/docker-compose.yaml --profile app up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: tollgate-postgres
    environment:
      POSTGRES_USER: tollgate
      POSTGRES_PASSWORD: tollgate
      POSTGRES_DB: tollgate
    ports:
      # Loopback only. Docker publishes on all interfaces by default, which on a
      # laptop on an untrusted network is an open Postgres with the password
      # below.
      - "127.0.0.1:5432:5432"
    volumes:
      - tollgate_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tollgate -d tollgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Valkey is the open-source, BSD-licensed fork of Redis. It is wire-compatible,
  # so the `redis` crate talks to it unchanged, and Memorystore for Valkey is the
  # cheaper managed option on GCP (see infra/terraform/valkey.tf). Local dev runs
  # with AOF on so budget counters survive a container restart; production tunes
  # persistence at the managed layer.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: tollgate-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      # Loopback only. Valkey here has no password at all, and it holds live
      # budget counters.
      - "127.0.0.1:6379:6379"
    volumes:
      - tollgate_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in via the `app` profile, so a plain `up -d` stays dependencies-only and
  # this does not crash-loop before .env exists.
  tollgate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tollgate-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      - TOLLGATE_HTTP__BIND=0.0.0.0:8080
      - TOLLGATE_DATABASE__URL=postgres://tollgate:tollgate@postgres:5432/tollgate
      # Dev only: apply migrations at boot so the stack starts on a fresh volume.
      - TOLLGATE_DATABASE__AUTO_MIGRATE=true
      - TOLLGATE_REDIS__URL=redis://valkey:6379
    ports:
      # Loopback only, like the dependencies above. The container binds 0.0.0.0
      # so the port can be published at all; the host side stays private.
      - "127.0.0.1:8080:8080"

volumes:
  tollgate_pg_data:
  tollgate_valkey_data:
