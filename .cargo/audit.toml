#
# Keeps a local `cargo audit` in step with CI: without this file a developer
# running it by hand sees a finding CI does not, concludes the gate is broken or
# the repo is vulnerable, and learns to ignore it. A gate people learn to ignore
# is worse than no gate.

[advisories]
# The ignores fall into two groups, held for different reasons and checked in
# different ways. Keep this list, the audit step in .github/workflows/ci.yml
# and DEVELOPMENT.md in step.
#
# Not in the build graph.
#
# RUSTSEC-2023-0071, the rsa "Marvin" timing sidechannel. rsa 0.10.0 fixes
# it, but sqlx-mysql 0.8.6 requires `rsa = "0.9"`, so no fix is reachable on
# sqlx 0.8. Ignored because the code never compiles into the binary: `rsa` has
# exactly one reverse dependency in Cargo.lock, `sqlx-mysql`, which is an
# optional dependency of sqlx that no enabled feature turns on. The `mysql`
# feature is off, and every other reference to it uses weak activation
# (`sqlx-mysql?/...`), which cannot enable an optional dependency.
#
# RUSTSEC-2026-0459, SQLite before 3.54.0 bundled in `libsqlite3-sys`. Ignored
# for the same reason: its one reverse dependency in Cargo.lock is
# `sqlx-sqlite`, another optional dependency of sqlx, which only sqlx's
# `sqlite`, `sqlite-unbundled` and `sqlite-preupdate-hook` features turn on.
# None is enabled, and every other reference uses weak activation
# (`sqlx-sqlite?/...`).
#
# Each of these two justifications ends the moment its crate enters the build
# graph. CI checks that on every run and fails if `sqlx-mysql`, `sqlx-sqlite`,
# `rsa` or `libsqlite3-sys` appears; DEVELOPMENT.md shows the same check to run
# by hand.
#
# In the build graph, until the migration off them.
#
# RUSTSEC-2026-0543 (chrono) and RUSTSEC-2026-0542 (humantime) are
# informational "unmaintained" notices, not vulnerabilities: neither reports a
# flaw, and neither lists a patched version. Both crates are compiled into the
# binary. chrono is a direct dependency and also reaches it through sqlx's
# `chrono` feature; humantime arrives through humantime-serde, which parses the
# duration settings. The humantime notice gives chrono's status as its reason,
# although humantime 2.4.0 has no runtime dependencies (chrono is only one of
# its dev-dependencies).
#
# These two ignores are temporary. An ignored advisory drops out of
# `cargo audit` output altogether, so this comment and a CI check are what keep
# the two notices on record. They are removed by the change that moves Tollgate
# from chrono to `time` (through sqlx's `time` feature) and replaces
# humantime-serde with a parser for the documented duration formats. A CI step
# fails once chrono or humantime has left the build graph, so the change that
# removes them has to remove that step, and these ignores go with it.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0459", "RUSTSEC-2026-0542", "RUSTSEC-2026-0543"]

[output]
# Match CI, which runs with --deny warnings. Unmaintained, unsound and yanked
# findings are the early ones, worth acting on while moving off the crate is
# still cheap.
#
# `quiet` is not optional: cargo-audit's [output] table requires it, and without
# it the whole file fails to parse and `cargo audit` refuses to run at all. This
# file shipped once without it and turned the advisory gate into a hard error.
#
# The tables here reject unknown keys, and some fields carry no serde default,
# so a missing one is a parse error rather than a fallback. `[database]` has the
# same trap with its `stale` field: if you ever add that table, set `stale` too.
deny = ["warnings"]
quiet = false
