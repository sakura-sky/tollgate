# SPDX-License-Identifier: MIT
# SPDX-FileCopyrightText: 2026 Andrew Stevens
#
# REUSE specification (https://reuse.software/spec/) - bulk licence info for
# files that don't carry an in-file SPDX header. Most source/config files
# carry headers directly; this file covers the remaining categories.

version = 1

[[annotations]]
path = [
    "LICENSE",
    "Cargo.lock",
    "Cargo.toml",
    ".gitignore",
    ".dockerignore",
    ".env.example",
    "infra/terraform/.terraform.lock.hcl",
    "assets/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Andrew Stevens"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "README.md",
    "CONTRIBUTING.md",
    "DEVELOPMENT.md",
    "SECURITY.md",
    "docs/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Andrew Stevens and Tollgate contributors"
SPDX-License-Identifier = "MIT"

# CODE_OF_CONDUCT.md is a derivative of the Contributor Covenant (CC BY 4.0);
# the file's own SPDX header captures both licences.
