name: CI

on:
  push:
    # Release branches and tags are built too: a release cut from a tag other
    # than main's tip would otherwise ship without CI ever seeing that tree.
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  # The advisory database changes without us touching the repo: a new RUSTSEC
  # entry is filed against a dependency we already ship. On push-only triggers
  # that advisory stays invisible until somebody happens to push, which on a
  # quiet week can be a long time. Only the audit job runs on this trigger;
  # every other job is guarded below.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All actions are pinned by full commit SHA, not by tag.
#
# A tag is mutable. Whoever controls the action's repository, or anyone who
# takes over that account, can repoint a tag at different code, and that code
# runs on our runner with our workflow token and our cache. A SHA cannot be
# repointed. When bumping a pin by hand, check the commit is on the upstream
# repository's own history: GitHub also resolves SHAs that exist only in forks.
#
# Pins are written as `uses: owner/action@<40-hex sha>  # vX.Y.Z`, with the
# version in a trailing comment so the pin stays readable. Dependabot's
# github-actions ecosystem (.github/dependabot.yml) proposes updates to them.
#
# Pinning covers the actions only. Still taken by tag or version range: the
# container images (valkey/valkey:8-alpine below, and fsfe/reuse:6, which
# fsfe/reuse-action's Dockerfile builds FROM), the runner image
# (ubuntu-latest), the Rust toolchains, and cargo-audit's version range.
jobs:
  rust:
    name: fmt / clippy / test
    # Scheduled runs exist for the advisory job alone. Rebuilding the same
    # commit weekly proves nothing and burns runner minutes.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing here pushes, comments or clones a second repository, so the
          # token has no reason to survive in .git/config where every later
          # step and every build script could read it.
          persist-credentials: false

      # Pin to the MSRV so CI fails if code uses anything newer than we promise.
      - name: Install Rust 1.88 (MSRV)
        run: |
          rustup toolchain install 1.88 --profile minimal --component rustfmt,clippy
          rustup default 1.88
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

  enforcement:
    name: budget enforcement (live Valkey)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # The ordinary test suite uses an in-memory budget backend and therefore
    # never executes the Lua that actually reserves and settles budgets. A green
    # `cargo test` says nothing about the enforcement mechanism, which is the
    # part of this system with the least margin for error. These tests run the
    # real scripts against a real server, and they are `#[ignore]`d so a
    # developer without one is not blocked.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        # Do not start the suite against a server that is not accepting
        # commands yet: the first test would fail on connect and read as a
        # code failure.
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88 (MSRV)
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      # Single-threaded: these tests share one server and assert on absolute
      # counter values, so running them concurrently makes them read each
      # other's writes.
      #
      # The count is asserted afterwards because a cargo test filter that
      # matches nothing exits 0. Without it, renaming the module or deleting the
      # tests would leave a green job attesting to coverage that no longer
      # exists, which is worse than having no job at all.
      #
      # One run, tee'd to a log: `pipefail` so a test failure is reported as a
      # test failure rather than as a missing count, and the full output stays
      # in the job log.
      - name: Enforcement tests
        env:
          TOLLGATE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -o pipefail
          cargo test --locked --lib redis_live -- --ignored --test-threads=1 \
            2>&1 | tee enforcement.log
          # `|| true`: the step runs under `bash -e`, so a grep that matches
          # nothing (cargo changing its output format) would abort here and the
          # diagnostic below would never print.
          ran=$(grep -oP '^test result: ok\. \K[0-9]+' enforcement.log | head -1 || true)
          echo "enforcement tests run: ${ran:-0}"
          if [ "${ran:-0}" -lt 12 ]; then
            echo "::error::expected at least 12 enforcement tests, ran ${ran:-0}."
            echo "::error::If tests were removed on purpose, lower this floor deliberately."
            exit 1
          fi

  reuse:
    name: REUSE compliance
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

  audit:
    name: cargo audit (advisories)
    # No `if` guard here on purpose: this is the job the weekly schedule exists
    # for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable, for the audit tool)
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # The advisories the audit step ignores are ignored only because the
      # crates they name never compile into Tollgate. cargo-audit reads
      # Cargo.lock, and that lists sqlx's MySQL and SQLite drivers although
      # neither is built: both are optional dependencies, and sqlx features
      # Tollgate enables (`time`, `uuid`, `migrate`) name them through weak
      # `?/` references. Such a reference puts an optional dependency in
      # Cargo.lock without turning it on. cargo-audit reports them all the
      # same, so the ignores rest on the build graph, and this step checks that
      # graph on every run.
      #
      # It fails if the sqlx MySQL or SQLite driver (`sqlx-mysql`,
      # `sqlx-sqlite`), or a crate behind an ignored advisory (`rsa`,
      # `libsqlite3-sys`), is in the graph for any target, in any workspace
      # member, with all features, through a normal, build or dev dependency.
      # `--workspace` matters because cargo-audit applies the ignores to the
      # whole lockfile, members included. The advisory crates are matched by
      # name as well, because another dependency could bring them in without
      # either driver.
      #
      # `+stable` because rust-toolchain.toml would otherwise select 1.88, which
      # this job does not install. The listing goes to a file, not a pipe: this
      # `run` uses GitHub's default `bash -e` without pipefail, so a failed
      # `cargo tree` piped into grep would match nothing and pass. For the same
      # reason `sqlx-postgres` must be in the listing, so an empty or reformatted
      # one fails rather than passes. Network access is needed: `cargo tree`
      # fetches every package in Cargo.lock, for all targets.
      - name: Check ignored advisories stay out of the build graph
        run: |
          graph="${RUNNER_TEMP:?}/build-graph.txt"
          cargo +stable tree --locked --workspace --all-features --target all \
            -e normal,build,dev --prefix none --format '{p}' > "$graph"
          if ! grep -q '^sqlx-postgres ' "$graph"; then
            echo "::error::cargo tree did not list sqlx-postgres, so its output cannot be trusted"
            exit 1
          fi
          if found=$(grep -E '^(sqlx-mysql|rsa|sqlx-sqlite|libsqlite3-sys) ' "$graph"); then
            echo "::error::A crate behind an advisory the audit step ignores is now in the build graph. Remove the dependency, or drop its ignore from this workflow and .cargo/audit.toml and deal with the advisory."
            cut -d ' ' -f 1,2 <<< "$found" | sort -u
            exit 1
          fi
          echo "Not in the build graph: sqlx-mysql, rsa, sqlx-sqlite, libsqlite3-sys"
      # Use +stable explicitly: the repo's rust-toolchain.toml pins the MSRV in
      # this directory, but the audit tool itself should build on current stable.
      #
      # A MINIMUM version, not an exact pin, and the difference matters.
      #
      # An exact pin was tried and broke the gate within a day. The advisory
      # database is a live input that gains entries continuously, which is the
      # whole reason this job runs weekly, so pinning the tool does not make the
      # result reproducible: it freezes the PARSER while the data keeps moving.
      # RUSTSEC-2026-0037 arrived carrying a CVSS 4.0 vector, cargo-audit 0.21
      # could not read it, and every run failed on a database entry rather than
      # on anything in this repo.
      #
      # Exact pins are right for a tool with a fixed input, which is why the
      # Dockerfile pins cargo-chef. They are wrong for a tool whose answer is
      # SUPPOSED to change without the repo changing.
      #
      # NOT a caret. On a 0.x crate Cargo's caret pins the first non-zero
      # component, so `^0.22` means `>=0.22.0, <0.23.0`: patch only. Every
      # cargo-audit format update ships in a 0.x MINOR (CVSS 4.0 support arrived
      # in 0.22), so a caret would have broken on exactly the same class of
      # advisory, just a release later. A floor with a major ceiling takes those
      # minors and still makes 1.0 a decision.
      #
      # This narrows the failure class rather than removing it: the gate still
      # fails closed the day the database carries something no released parser
      # understands. That is the correct direction for a security gate, and
      # `--locked` fixes the tool's own dependency tree either way.
      - name: Install cargo-audit
        # This step and the next run even when the build-graph check fails, so
        # one run still reports a new advisory, including the weekly one.
        if: ${{ !cancelled() }}
        run: cargo +stable install cargo-audit --locked --version ">=0.22, <1.0"
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        # `--deny warnings` because the default exits 0 on the warning-class
        # advisories (unmaintained, unsound, yanked). Those are exactly the
        # early signals worth acting on while there is still time to move off
        # the crate, and a gate that passes on them is not a gate.
        #
        # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel) is fixed in rsa
        # 0.10.0, but sqlx-mysql 0.8.6 requires `rsa = "0.9"`, so no fix is
        # reachable on sqlx 0.8. It is ignored because the code never compiles
        # into the binary: `rsa` has exactly one reverse dependency in
        # Cargo.lock, `sqlx-mysql`, which is an optional dependency of sqlx
        # that no enabled feature turns on. We do not enable sqlx's `mysql`
        # feature, and every other reference to it uses weak activation
        # (`sqlx-mysql?/...`), which cannot enable an optional dependency that
        # is otherwise off.
        #
        # RUSTSEC-2026-0459 (libsqlite3-sys: SQLite before 3.54.0 can return
        # uninitialised page-cache memory for a crafted database and WAL pair)
        # is ignored for the same reason. `libsqlite3-sys` has exactly one
        # reverse dependency in Cargo.lock, `sqlx-sqlite`, another optional
        # dependency of sqlx. Only sqlx's `sqlite`, `sqlite-unbundled` and
        # `sqlite-preupdate-hook` features turn it on (`all-databases` reaches
        # it through `sqlite`). We enable none of them, and every other
        # reference uses weak activation (`sqlx-sqlite?/...`). No sqlx 0.8
        # release accepts the patched libsqlite3-sys 0.39, so there is no
        # update to take instead.
        #
        # Each ignore stops being valid the moment its crate enters the build
        # graph, and the "Check ignored advisories stay out of the build graph"
        # step above fails the job when that happens. Everything else stays
        # strict.
        #
        # `+stable` here too, so the rustup `cargo` shim runs the audit on
        # stable rather than resolving rust-toolchain.toml to 1.88, which this
        # job does not install, and cargo-audit's own `cargo -V` call for the
        # crates.io index (used for yanked-crate detection) gets the same
        # stable cargo.
        run: cargo +stable audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
